# Local development database (PostgreSQL + PostGIS, same major version as RDS).
#   docker compose up -d
#   dotnet run --project src/CocoRider.Api
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: cocorider
      POSTGRES_USER: cocorider
      POSTGRES_PASSWORD: cocorider
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
